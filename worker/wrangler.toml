name = "minuut-leeswijzer"
main = "src/index.js"
compatibility_date = "2026-03-01"
# node:zlib for the cache's answer codec (src/cache.js).
compatibility_flags = ["nodejs_compat"]
# The API lives on the custom domain (extension 1.1 and later), behind the
# zone's WAF rate-limiting rule (CONTRIBUTING.md).
routes = [{ pattern = "leeswijzer-api.minuut.eu", custom_domain = true }]
# Extension 1.0.x has the workers.dev URL built in, so that host stays on until
# 1.0.x is gone; it only serves /v1/judge, with tighter limits (src/index.js,
# LEGACY_CALLS). Switch-off plan in CONTRIBUTING.md: then set this to false.
workers_dev = true

# No request logging: Workers Logs and traces stay off.
[observability]
enabled = false

# Pin the store extension(s) once published, e.g.
#   ALLOWED_ORIGINS = "chrome-extension://abcdefghijklmnopabcdefghijklmnop"
# Empty = any browser extension (development).
[vars]
ALLOWED_ORIGINS = "chrome-extension://djlkngghkpadabjgmegaeelmffhhljfe,chrome-extension://bobkkcopddkeckpomcpfdnocgkkihiep"

# Rate limits (see "Rate limiting" in src/index.js): exact in-memory counters
# in a Durable Object per client (judge calls 500/10 s and 900/min, lookup
# items 600/10 s and 1800/min), with free in-isolate checks in front; globally
# 3000 Jev calls/min and 80000/day, reported by each isolate at most every 10 s.
# The global Limiter also keeps the anonymous daily counters (src/stats.js) in
# its SQLite storage, and each ping Limiter the day it last counted a ping;
# same class, so no new migration.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Shared cache of Jev's answers about public ruling text (calls without a
# question only; see src/cache.js). Schema in migrations/. wrangler dev uses a
# local database: wrangler d1 migrations apply leeswijzer-cache --local.
# Deploying your own Worker needs your own database id here.
[[d1_databases]]
binding = "DB"
database_name = "leeswijzer-cache"
database_id = "a8bcc9af-76c1-4441-b155-66b54e60d778"
migrations_dir = "migrations"

# Secrets, set with: wrangler secret put AI_GATEWAY_API_KEY / wrangler secret put RL_SALT
# (RL_SALT: 16+ characters; without it the Worker answers 503).
# Optional: wrangler secret put STATS_TOKEN switches on GET /v1/stats (404 without it).
